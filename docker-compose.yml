services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vg_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql
      - mongo
    environment:
      DB_HOST: mysql
      DB_NAME: vite_gourmand
      DB_USER: vg_user
      DB_PASSWORD: vg_password
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: vite_gourmand_stats

  mysql:
    image: mysql:8.0
    container_name: vg_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: vg_user
      MYSQL_PASSWORD: vg_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01_database.sql
      - ./database/jeu_de_donnees.sql:/docker-entrypoint-initdb.d/02_jeu_de_donnees.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vg_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  mongo:
    image: mongo:7
    container_name: vg_mongo
    restart: unless-stopped
    ports:
      - "8090:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
