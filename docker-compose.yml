services:

  # ------------------------------------------------------------
  # Serveur web : Apache + PHP + extensions PDO/MongoDB
  # ------------------------------------------------------------
  web:
    build: ./app
    container_name: vg_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql
      - mongo
    environment:
      DB_HOST: mysql
      DB_NAME: vite_gourmand
      DB_USER: vg_user
      DB_PASSWORD: vg_password
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: vite_gourmand_stats

  # ------------------------------------------------------------
  # Base relationnelle
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vg_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"          # hôte:conteneur -> évite le conflit avec un MySQL local (XAMPP) sur 3306
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: vg_user
      MYSQL_PASSWORD: vg_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_creation_tables.sql:/docker-entrypoint-initdb.d/01_creation_tables.sql
      - ./database/02_insertion_donnees.sql:/docker-entrypoint-initdb.d/02_insertion_donnees.sql

  # ------------------------------------------------------------
  # Interface d'administration MySQL (équivalent phpMyAdmin d'XAMPP)
  # ------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vg_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  # ------------------------------------------------------------
  # Base NoSQL (statistiques)
  # ------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: vg_mongo
    restart: unless-stopped
    ports:
      - "8090:27017"          # cohérent avec votre habitude vue en cours
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
