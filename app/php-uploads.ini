/**
 * Fichier de configuration PHP pour les uploads
 * La taille maximale est de 32M pour les fichiers uploadés dans l application
 */
upload_max_filesize = 15M
/**
 * La directive post_max_size doit être supérieure à upload_max_filesize
 * La taille maximale des données POST est de 32M pour les fichiers uploadés dans l application
 */
post_max_size = 15M
